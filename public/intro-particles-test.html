<style>
/* First paint shares V3's saved theme before its bundled stylesheet is ready. */
:root{--paper:#f5f4f0;--ink:#292a28}
html[data-theme="dark"]{--paper:#20221f;--ink:#ece9df}
html[data-palette="olive"]{--paper:#F4EBDC;--ink:#303D29}
html[data-palette="olive"][data-theme="dark"]{--paper:#303D29;--ink:#F4EBDC}
html,body{margin:0;background:var(--paper);color:var(--ink)}
#story-startup-cloud{position:fixed;inset:0;display:block;width:100%;height:100%;z-index:4;pointer-events:none;background:var(--paper);color:var(--ink);opacity:1;transition:opacity .45s ease}
#story-startup-cloud.is-ready{opacity:0}
@media(prefers-reduced-motion:reduce){#story-startup-cloud{transition:none}}
</style>

<body class="particles-test">
<canvas id="story-startup-cloud" aria-hidden="true"></canvas>
<script>
// A static first paint, not a second animation. The WebGL score takes over only
// after it has really rendered; slow connections never begin with loading text.
(()=>{
  const canvas=document.getElementById('story-startup-cloud'),context=canvas.getContext('2d');
  if(!context){canvas.remove();return;}
  let finished=false;
  function draw(){
    if(finished)return;
    const width=innerWidth,height=innerHeight,dpr=Math.min(devicePixelRatio||1,1.5);
    canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
    context.setTransform(dpr,0,0,dpr,0,0);
    context.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
    let seed=0x534d2027;
    const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
    const camera=Math.max(60,51/(width/height))*1.06,focal=height/(2*Math.tan(Math.PI/8));
    for(let i=0;i<8400;i++){
      const z=random()*2-1,angle=random()*Math.PI*2,ring=Math.sqrt(1-z*z),radius=12*(1.65+random()*1.15);
      const depth=camera-z*radius,x=width/2+Math.cos(angle)*ring*radius*focal/depth,y=height/2-Math.sin(angle)*ring*radius*focal/depth;
      const size=.30+random()*.40,intensity=.22+random()*.42;
      if(x< -1||x>width+1||y< -1||y>height+1)continue;
      context.globalAlpha=intensity*(.7+.3*(z+1)/2);
      context.beginPath();context.arc(x,y,size,0,Math.PI*2);context.fill();
    }
    context.globalAlpha=1;
  }
  const observer=new MutationObserver(draw);
  observer.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','data-palette']});
  window.addEventListener('resize',draw,{passive:true});
  window.addEventListener('intro-particles:first-frame',()=>{
    finished=true;observer.disconnect();window.removeEventListener('resize',draw);
    canvas.classList.add('is-ready');
    setTimeout(()=>canvas.remove(),matchMedia('(prefers-reduced-motion: reduce)').matches?0:460);
  },{once:true});
  draw();
})();
</script>

      <button id="utility-palette" type="button" aria-label="Prepnúť na Olive" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 1.4-3.4 1.5 1.5 0 0 1 1.1-2.6H18a3 3 0 0 0 3-3 9 9 0 0 0-9-9Z"/><circle cx="7.5" cy="10" r="1"/><circle cx="10.5" cy="6.7" r="1"/><circle cx="15" cy="7.2" r="1"/></svg></button>
